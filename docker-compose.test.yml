version: '3.8'

services:
  test-postgres:
    image: postgres:15-alpine
    container_name: moneymanagement_postgres_test
    environment:
      POSTGRES_DB: moneymanagement_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d moneymanagement_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
